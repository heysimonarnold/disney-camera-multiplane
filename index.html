<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://heysimonarnold.github.io/disney-camera-multiplane/"
    />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <!-- Open Graph -->
    <meta
      property="og:url"
      content="https://heysimonarnold.github.io/disney-camera-multiplane/"
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Disney: Caméra Multiplane" />
    <meta
      property="og:description"
      content="Animation CSS démontrant le fonctionnement de la fameuse caméra multiplane de Disney!"
    />

      property="og:image"
      content="https://heysimonarnold.github.io/disney-camera-multiplane/img/og-image.png"
    />

  <body>
    <div class="multiplane">
      <div class="wrapper">
        <img src="./img/1.webp" class="layer depth-4" />
        <img src="./img/2.webp" class="layer depth-3" />
        <img src="./img/3.webp" class="layer depth-2" />
        <img src="./img/4.webp" class="layer depth-1" />
      </div>
    </div>

    <nav class="nav">
      <button class="btn btn-45"></button>
      <button class="btn btn-play-pause is-playing">
        <svg
          class="play-icon"
          focusable="false"
          aria-hidden="true"
          viewBox="0 0 24 24"
          fill="currentColor"
          width="24"
          height="24"
        >
          <path d="M8 5v14l11-7z"></path>
        </svg>

        <svg
          class="pause-icon"
          focusable="false"
          aria-hidden="true"
          viewBox="0 0 24 24"
          fill="currentColor"
          width="24"
          height="24"
        >
          <path d="M6 19h4V5H6zm8-14v14h4V5z" />
        </svg>
      </button>
      <a href="https://youtu.be/5D2q72tJGA8" class="btn" target="_blank">
        <svg
          focusable="false"
          aria-hidden="true"
          viewBox="0 0 24 24"
          fill="currentColor"
          width="24"
          height="24"
        >
          <path
            d="M10 15l5.19-3L10 9v6m11.56-7.83c.13.47.22 1.1.28 1.9.07.8.1 1.49.1 2.09L22 12c0 2.19-.16 3.8-.44 4.83-.25.9-.83 1.48-1.73 1.73-.47.13-1.33.22-2.65.28-1.3.07-2.49.1-3.59.1L12 19c-4.19 0-6.8-.16-7.83-.44-.9-.25-1.48-.83-1.73-1.73-.13-.47-.22-1.1-.28-1.9-.07-.8-.1-1.49-.1-2.09L2 12c0-2.19.16-3.8.44-4.83.25-.9.83-1.48 1.73-1.73.47-.13 1.33-.22 2.65-.28 1.3-.07 2.49-.1 3.59-.1L12 5c4.19 0 6.8.16 7.83.44.9.25 1.48.83 1.73 1.73z"
          ></path>
        </svg>
      </a>
    </nav>

    <script type="module" src="./src/main.js"></script>

</html>
